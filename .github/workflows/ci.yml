name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  app:
    name: Flutter App Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Check hardcoded rules
        run: |
          chmod +x tool/check_hardcoded.sh
          tool/check_hardcoded.sh

  rules:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'rules_test/package-lock.json'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install rules_test dependencies
        run: |
          cd rules_test
          npm ci

      - name: Run security rules tests
        run: |
          cd rules_test
          npx firebase emulators:exec --only firestore "npm test"
